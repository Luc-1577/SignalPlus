# Aumenta a memória para 2GB ? evita OutOfMemoryError em builds grandes
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Build paralelo e incremental ? acelera muito o tempo de compilação
org.gradle.parallel=true
org.gradle.configuration-cache=true
kotlin.incremental=true

# AndroidX obrigatório em projetos modernos
android.useAndroidX=true

# R8 full mode ? melhor minificação no release
android.enableR8.fullMode=true

# Desativa log verbose de coroutines em produção
kotlinx.coroutines.debug=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false